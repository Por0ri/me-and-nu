# Standalone local task runtime. Do not merge with API/Checking/Labs Compose files.
name: me-nu-worker

x-runtime: &runtime
  image: me-nu-worker:local
  build:
    context: ./worker
    additional_contexts:
      anime-registry: "./agents/ani_me;nu/config"
      anime-works: ./catalog
  restart: unless-stopped
  init: true
  read_only: true
  tmpfs:
    - /tmp:rw,noexec,nosuid,size=32m
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  pids_limit: 64
  mem_limit: 256m
  cpus: "0.50"
  networks: [tasks]
  depends_on:
    redis-tasks:
      condition: service_healthy
  logging:
    driver: json-file
    options:
      max-size: "5m"
      max-file: "2"

x-environment: &environment
  CELERY_BROKER_URL: redis://redis-tasks:6379/0
  CELERY_RESULT_BACKEND: redis://redis-tasks:6379/1
  CELERY_BEAT_INTERVAL_SECONDS: ${CELERY_BEAT_INTERVAL_SECONDS:-30}

x-job-environment: &job-environment
  <<: *environment
  CONTENT_JOB_KIND: fake
  CONTENT_JOB_DATABASE_URL: "postgresql://menu_jobs:${CONTENT_JOB_DB_PASSWORD:?Run python worker/setup_local.py and pass --env-file worker/.env}@jobs-db:5432/menu_content_jobs"
  CONTENT_JOB_ARTIFACT_ROOT: /var/lib/menu-jobs

x-anime-environment: &anime-environment
  <<: *job-environment
  CONTENT_JOB_KIND: anime
  CELERY_BROKER_URL: redis://anime-redis:6379/0
  CELERY_RESULT_BACKEND: redis://anime-redis:6379/1

services:
  redis-tasks: &queue-redis
    image: redis:8.2-alpine
    restart: unless-stopped
    command: [redis-server, --appendonly, "yes", --appendfsync, everysec, --maxmemory, 128mb, --maxmemory-policy, noeviction]
    volumes: [redis-tasks-data:/data]
    networks: [tasks, monitor]
    ports:
      - "127.0.0.1:${REDIS_TASKS_PORT:-6380}:6379"
    mem_limit: 256m
    cpus: "0.25"
    pids_limit: 32
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 5s
      timeout: 3s
      retries: 10
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "2"

  anime-redis:
    <<: *queue-redis
    profiles: [anime]
    volumes: [anime-redis-data:/data]
    ports:
      - "127.0.0.1:${ANIME_REDIS_PORT:-6381}:6379"

  worker:
    <<: *runtime
    environment: *environment
    stop_grace_period: 30s
    healthcheck:
      test: [CMD, python, -m, menu_worker.health, worker]
      interval: 15s
      timeout: 7s
      retries: 3
      start_period: 15s

  jobs-db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: menu_jobs
      POSTGRES_DB: menu_content_jobs
      POSTGRES_PASSWORD: ${CONTENT_JOB_DB_PASSWORD:?Run python worker/setup_local.py and pass --env-file worker/.env}
    command: [postgres, -c, shared_buffers=64MB, -c, max_connections=20]
    volumes: [jobs-db-data:/var/lib/postgresql/data]
    networks: [tasks]
    mem_limit: 384m
    cpus: "0.25"
    pids_limit: 64
    shm_size: 64m
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U menu_jobs -d menu_content_jobs"]
      interval: 5s
      timeout: 3s
      retries: 15
      start_period: 15s
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "2"

  job-init:
    <<: *runtime
    restart: "no"
    environment: *job-environment
    command: [python, -m, menu_worker.jobs, init-db]
    depends_on:
      jobs-db:
        condition: service_healthy
    healthcheck:
      disable: true

  job-worker:
    <<: *runtime
    environment: *job-environment
    command: [celery, -A, "menu_worker.app:app", worker, --loglevel=INFO, --concurrency=1, --queues=content-generation, "--hostname=content@%h", --events]
    volumes: [job-artifacts:/var/lib/menu-jobs]
    stop_grace_period: 60s
    depends_on:
      redis-tasks:
        condition: service_healthy
      jobs-db:
        condition: service_healthy
      job-init:
        condition: service_completed_successfully
    healthcheck:
      test: [CMD, python, -m, menu_worker.health, job-worker]
      interval: 15s
      timeout: 7s
      retries: 3
      start_period: 15s

  job-dispatcher:
    <<: *runtime
    environment: *job-environment
    command: [python, -m, menu_worker.jobs, dispatch, --loop]
    volumes: [job-artifacts:/var/lib/menu-jobs:ro]
    depends_on:
      redis-tasks:
        condition: service_healthy
      jobs-db:
        condition: service_healthy
      job-init:
        condition: service_completed_successfully
    healthcheck:
      test: [CMD, python, -m, menu_worker.health, job-dispatcher]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 15s

  anime-worker:
    <<: *runtime
    profiles: [anime]
    environment: *anime-environment
    command: [celery, -A, "menu_worker.anime_app:app", worker, --loglevel=INFO, --concurrency=1, --queues=anime-generation, "--hostname=anime@%h", --events]
    volumes: [anime-artifacts:/var/lib/menu-jobs]
    stop_grace_period: 60s
    depends_on: &anime-dependencies
      anime-redis:
        condition: service_healthy
      jobs-db:
        condition: service_healthy
      job-init:
        condition: service_completed_successfully
    healthcheck:
      test: [CMD, python, -m, menu_worker.health, anime-worker]
      interval: 15s
      timeout: 7s
      retries: 3
      start_period: 15s

  anime-dispatcher:
    <<: *runtime
    profiles: [anime]
    environment: *anime-environment
    command: [python, -m, menu_worker.jobs, dispatch, --loop]
    volumes: [anime-artifacts:/var/lib/menu-jobs:ro]
    depends_on: *anime-dependencies
    healthcheck:
      test: [CMD, python, -m, menu_worker.health, anime-dispatcher]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 15s

  beat:
    <<: *runtime
    environment: *environment
    # The scheduler holds a process lock on the shared schedule volume.
    command: [celery, -A, "menu_worker.app:app", beat, --loglevel=INFO, --scheduler=menu_worker.scheduler:SingleBeatScheduler, --schedule=/var/lib/menu-beat/schedule, --pidfile=/tmp/beat.pid]
    volumes: [beat-data:/var/lib/menu-beat]
    healthcheck:
      test: [CMD, python, -m, menu_worker.health, beat]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: ${CELERY_BEAT_INTERVAL_SECONDS:-30}s

  flower:
    <<: *runtime
    # Docker Desktop needs a normal bridge for published localhost ports.
    networks: [tasks, monitor]
    depends_on:
      redis-tasks:
        condition: service_healthy
      worker:
        condition: service_healthy
    environment:
      <<: *environment
      FLOWER_BASIC_AUTH: ${FLOWER_BASIC_AUTH:?Run python worker/setup_local.py and pass --env-file worker/.env}
    command: [celery, -A, "menu_worker.app:app", flower, --conf=/app/flowerconfig.py]
    ports:
      - "127.0.0.1:${FLOWER_PORT:-5555}:5555"
    volumes: [flower-data:/var/lib/menu-flower]
    healthcheck:
      test: [CMD, python, -m, menu_worker.health, flower]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 15s

volumes:
  redis-tasks-data:
  beat-data:
  flower-data:
  jobs-db-data:
  job-artifacts:
  anime-redis-data:
  anime-artifacts:

networks:
  tasks:
    internal: true
  monitor:
