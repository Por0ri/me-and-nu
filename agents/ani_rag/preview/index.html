<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ani_rag 작업 미리보기</title>
  <style>
    :root{color-scheme:dark;--bg:#0b1018;--panel:#121a26;--line:#263548;--text:#eef4ff;--muted:#9daec2;--blue:#79b8ff;--green:#8ddbb4;--amber:#ffd17a;--red:#ff8b84}
    *{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:15px/1.55 system-ui,"Malgun Gothic",sans-serif}
    header{position:sticky;top:0;z-index:2;background:#0d1420eF;border-bottom:1px solid var(--line);backdrop-filter:blur(12px);padding:18px max(20px,calc((100% - 1120px)/2))}
    h1{font-size:22px;margin:0 0 4px}.sub{color:var(--muted);font-size:13px}.bar{max-width:1120px;margin:auto}.tabs{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap}.tab{border:1px solid var(--line);border-radius:9px;background:#111a28;color:var(--text);padding:8px 13px;cursor:pointer}.tab.active{border-color:var(--blue);color:var(--blue);background:#14283a}
    main{max-width:1120px;margin:24px auto;padding:0 18px 70px}.toolbar{display:flex;justify-content:space-between;align-items:center;gap:10px;color:var(--muted);font-size:13px;margin-bottom:14px}.list{display:grid;gap:16px}.draft,.source,.review{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:18px;overflow:hidden}.drafthead{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}.draft h2{font-size:21px;margin:0 0 8px}.meta{display:flex;gap:7px;flex-wrap:wrap;margin:8px 0 12px}.pill{font-size:12px;padding:3px 9px;border-radius:999px;background:#1d2a3a;color:#c8d9ec}.pill.good{color:var(--green)}.pill.warn{color:var(--amber)}.pill.bad{color:var(--red)}
    .summary{color:#d5e0ed}.pages{display:grid;grid-template-columns:repeat(auto-fit,minmax(245px,1fr));gap:14px;margin:16px 0}.page{background:#0a0d12;border:1px solid #344256;border-radius:12px;overflow:hidden}.page img{display:block;width:100%;aspect-ratio:1308/1632;object-fit:cover;background:#05070a}.copy{padding:14px 15px 17px;background:#10141c}.copy h3{margin:0 0 7px;font-size:18px}.copy p{white-space:pre-wrap;margin:0;color:#dae3ef}.pagefoot{padding:7px 12px;color:var(--muted);font-size:11px;background:#0e1520}
    details{margin-top:13px;border-top:1px solid var(--line);padding-top:12px}summary{cursor:pointer;color:var(--blue);font-weight:600}.article{white-space:pre-wrap;color:#d8e1ec;margin-top:12px}.links{display:flex;gap:10px;flex-wrap:wrap}.links a,.source a{color:var(--blue);overflow-wrap:anywhere}a{color:var(--blue)}.sources{margin-top:12px;border-top:1px solid var(--line);padding-top:11px}.sources ul{margin:6px 0;padding-left:20px}.disclosure{color:var(--muted);font-size:13px;margin-top:12px}.empty{border:1px dashed var(--line);border-radius:12px;padding:30px;color:var(--muted);text-align:center}
    .reviewreason{margin:10px 0;padding:12px;border-left:3px solid var(--amber);background:#181c21;border-radius:5px}.reviewreason.bad{border-color:var(--red)}.reviewreason h4{margin:0 0 5px}.reviewreason p{margin:4px 0;white-space:pre-wrap}.sourcegrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:14px}.source h3{margin:0 0 6px}.source p{color:var(--muted);font-size:13px}.footnote{color:var(--muted);font-size:12px;margin-top:20px}
    @media(max-width:650px){header{padding:15px 16px}.drafthead{display:block}.draft h2{font-size:19px}.pages{grid-template-columns:1fr}.page{max-width:430px}}
  </style>
</head>
<body>
  <header><div class="bar">
    <h1>ani_rag 작업 미리보기</h1>
    <div class="sub">수집 → 근거 저장 → 생성 → 독립 검수 · 로컬 읽기 전용 뷰 · 5초마다 갱신</div>
    <nav class="tabs" aria-label="보기 선택">
      <button class="tab active" data-view="content">콘텐츠</button>
      <button class="tab" data-view="rejected">탈락 보관</button>
      <button class="tab" data-view="revisions">수정 요청</button>
      <button class="tab" data-view="sources">출처</button>
      <button class="tab" data-view="workers">작업 상태</button>
    </nav>
  </div></header>
  <main>
    <div class="toolbar"><span id="count">불러오는 중…</span><span id="updated"></span></div>
    <section id="content" class="list"></section>
    <section id="rejected" class="list" hidden></section>
    <section id="revisions" class="list" hidden></section>
    <section id="sources" class="sourcegrid" hidden></section>
    <section id="workers" class="list" hidden></section>
    <p class="footnote">이미지 PNG와 카드 텍스트는 별도 저장 데이터를 함께 표시합니다. 원문 링크는 새 탭으로 열립니다. DB에는 쓰지 않습니다.</p>
  </main>
<script>
  const labels={ready_for_downstream:'검수 통과',revision_requested:'수정 요청',evidence_requested:'근거 보완 요청',rejected_archived:'탈락 보관',awaiting_manual_visual_review:'수동 검토 대기',revise:'수정 요청',request_evidence:'근거 보완 요청',reject_archive:'탈락 보관',human_review:'수동 검토'};
  const esc=(s)=>String(s??'');
  function node(tag,cls,text){const e=document.createElement(tag);if(cls)e.className=cls;if(text!==undefined)e.textContent=esc(text);return e}
  function link(url,label){if(!url)return null;let parsed;try{parsed=new URL(url)}catch{return null}if(!['http:','https:'].includes(parsed.protocol))return null;const a=node('a','',label||url);a.href=parsed.href;a.target='_blank';a.rel='noopener noreferrer';return a}
  function statusPill(status){const p=node('span','pill',labels[status]||status);if(status==='ready_for_downstream')p.classList.add('good');else if(status==='revision_requested'||status==='evidence_requested')p.classList.add('warn');else if(status==='rejected_archived')p.classList.add('bad');return p}
  function sourceBlock(sources){const div=node('div','sources');div.append(node('b','', '근거 출처'));const ul=node('ul');for(const s of sources||[]){const li=node('li');const a=link(s.source_url,s.publisher||s.source_url);if(a)li.append(a);if(s.published_at)li.append(document.createTextNode(' · '+s.published_at));ul.append(li)}if(!sources?.length)ul.append(node('li','', '연결된 출처가 아직 없습니다.'));div.append(ul);return div}
  function draftCard(db,d){const article=node('article','draft');const head=node('div','drafthead');const titlebox=node('div');titlebox.append(node('h2','',d.title));const meta=node('div','meta');meta.append(node('span','pill',db.id==='live'?'실시간 실행':'이전 파일럿'));meta.append(statusPill(d.status));meta.append(node('span','pill',d.content_type));meta.append(node('span','pill','작품 ID '+((d.menu_work_ids||[]).join(', ')||'미연결')));titlebox.append(meta);head.append(titlebox);head.append(node('span','sub',d.created_at));article.append(head);if(d.summary)article.append(node('p','summary',d.summary));
    const pages=node('div','pages');for(const c of d.cards||[]){const page=node('div','page');const img=document.createElement('img');img.loading='lazy';img.alt=c.title||'카드 이미지';img.src=`/card/${db.id}/${encodeURIComponent(c.card_id)}`;page.append(img);const copy=node('div','copy');copy.append(node('h3','',c.title));copy.append(node('p','',c.body));page.append(copy);page.append(node('div','pagefoot',`페이지 ${c.page_no} · ${c.role}`));pages.append(page)}if(d.cards?.length)article.append(pages);
    const details=document.createElement('details');const sum=node('summary','','상세 글 · 출처 · AI 안내');details.append(sum);details.append(node('div','article',d.body));details.append(sourceBlock(d.sources));if(d.ai_disclosure)details.append(node('p','disclosure',d.ai_disclosure));article.append(details);return article}
  function reasonLines(result){const out=[];for(const issue of result?.issues||[]){if(issue?.message)out.push(issue.message)}for(const instruction of result?.revision_instructions||[]){if(instruction)out.push(instruction)}for(const request of result?.evidence_requests||[]){if(request)out.push('근거 요청: '+request)}return [...new Set(out)]}
  function reviewCard(db,r){const card=node('article','review');const top=node('div','drafthead');const box=node('div');box.append(node('h3','',r.title));const meta=node('div','meta');meta.append(node('span','pill',db.id==='live'?'실시간 실행':'이전 파일럿'));meta.append(statusPill(r.decision==='pass'?'ready_for_downstream':r.decision==='reject_archive'?'rejected_archived':r.decision));meta.append(node('span','pill',`수정 ${r.revision_count}회`));box.append(meta);top.append(box);top.append(node('span','sub',r.reviewed_at));card.append(top);const reasons=reasonLines(r.result);const block=node('div','reviewreason'+(r.decision==='reject_archive'?' bad':''));block.append(node('h4','',r.decision==='reject_archive'?'탈락 사유':r.decision==='revise'?'수정 사유':'검수 기록'));if(reasons.length)for(const reason of reasons)block.append(node('p','',reason));else block.append(node('p','','기록된 사유 문구가 없습니다.'));card.append(block);const sources=r.result?.source_urls||[];if(sources.length){const links=node('div','links');for(const u of sources){const a=link(u);if(a)links.append(a)}card.append(links)}return card}
  function renderSources(data){const target=document.getElementById('sources');target.replaceChildren();const registered=new Map();for(const db of data.databases)for(const r of db.registered_sources||[]){if(!registered.has(r.source_id))registered.set(r.source_id,[]);registered.get(r.source_id).push(db.id)}for(const s of data.sources||[]){if(s.status!=='approved')continue;const card=node('article','source');card.append(node('h3','',s.name));card.append(node('div','meta'));const meta=card.querySelector('.meta');meta.append(node('span','pill',s.source_id));meta.append(node('span','pill',s.content_types.join(', ')));meta.append(node('span','pill',registered.has(s.source_id)?'DB 등록됨':'설정 승인'));if(s.source_id==='ann_encyclopedia')meta.append(node('span','pill good','이번 시험 출처'));if(s.site_url){const a=link(s.site_url,s.site_url);card.append(a)}card.append(node('p','',s.usage_notes));const dbs=registered.get(s.source_id)||[];if(dbs.length)card.append(node('small','sub',`등록 DB: ${dbs.join(', ')}`));target.append(card)}if(!target.children.length)target.append(node('div','empty','승인된 출처가 없습니다.'))}
  function render(){fetch('/api',{cache:'no-store'}).then(r=>r.json()).then(data=>{const content=document.getElementById('content'),rejected=document.getElementById('rejected'),revisions=document.getElementById('revisions'),workers=document.getElementById('workers');content.replaceChildren();rejected.replaceChildren();revisions.replaceChildren();workers.replaceChildren();let drafts=0,reviewCount=0,rejectedCount=0,revisionCount=0;for(const db of data.databases){for(const d of db.drafts||[]){drafts++;content.append(draftCard(db,d))}for(const r of db.reviews||[]){reviewCount++;if(r.decision==='reject_archive'){rejectedCount++;rejected.append(reviewCard(db,r))}else if(r.decision==='revise'||r.decision==='request_evidence'){revisionCount++;revisions.append(reviewCard(db,r))}}const panel=node('article','draft');panel.append(node('h2','',db.id==='live'?'현재 실시간 DB':'이전 파일럿 DB'));const queue=node('div','meta');for(const q of db.queues||[])queue.append(node('span','pill',`${q.queue_name}: ${q.status} ${q.count}`));panel.append(queue);panel.append(node('p','sub',`초안 ${db.drafts?.length||0}건 · 검수 기록 ${db.reviews?.length||0}건`));workers.append(panel)}if(!drafts)content.append(node('div','empty','아직 생성된 초안이 없습니다. 수집 후 자동으로 여기에 나타납니다.'));if(!rejectedCount)rejected.append(node('div','empty','탈락 보관된 콘텐츠가 없습니다.'));if(!revisionCount)revisions.append(node('div','empty','수정 요청 기록이 없습니다.'));if(!workers.children.length)workers.append(node('div','empty','작업 DB 상태를 확인할 수 없습니다.'));renderSources(data);document.getElementById('count').textContent=`콘텐츠 ${drafts}건 · 탈락 ${rejectedCount}건 · 수정 요청 ${revisionCount}건`;document.getElementById('updated').textContent='갱신 '+new Date().toLocaleTimeString('ko-KR')}).catch(()=>{document.getElementById('updated').textContent='미리보기 서버에 연결 중…'})}
  document.querySelectorAll('.tab').forEach(button=>button.addEventListener('click',()=>{document.querySelectorAll('.tab').forEach(b=>b.classList.toggle('active',b===button));for(const id of ['content','rejected','revisions','sources','workers'])document.getElementById(id).hidden=id!==button.dataset.view}));
  render();setInterval(render,5000);
</script>
</body>
</html>
