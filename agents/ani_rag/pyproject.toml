[project]
name = "ani-rag"
version = "0.1.0"
description = "Independent evergreen evidence collection and RAG workspace for me;nu"
requires-python = ">=3.12,<3.13"
dependencies = [
  "openai>=2.0",
  "Pillow>=11.0",
  "python-dotenv>=1.0",
]

[project.optional-dependencies]
archive-import = ["pgdumplib>=4.0,<5"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ani_rag"]

[tool.hatch.build.targets.wheel.force-include]
"src/ani_rag/storage/schema.sql" = "ani_rag/storage/schema.sql"
