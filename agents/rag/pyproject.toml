[project]
name = "ani-rag"
version = "0.1.0"
description = "me;nu 정보사전(RAG) — 이미 알려진 애니 사실을 출처와 함께 모으고, 그 사전으로 글을 만드는 에이전트"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
  "langchain-openai>=1.0",
  "langgraph>=1.0",
  "openai>=2.0",
  "pillow>=11.0",
  "psycopg[binary]>=3.2",
  "pydantic>=2.11",
  "pydantic-settings>=2.10",
]

[dependency-groups]
dev = [
  "pytest>=8.4",
  "ruff>=0.14",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ani_rag"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"

[tool.ruff]
target-version = "py312"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
