[project]
name = "ani-menu-agent"
version = "0.2.0"
description = "검증된 애니메이션 소식을 me;nu 카드뉴스로 만드는 LangGraph 에이전트"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
  "beautifulsoup4>=4.13",
  "ddgs>=9.5",
  "feedparser>=6.0",
  "httpx>=0.28",
  "langchain-openai>=1.0",
  "langgraph>=1.0",
  "langsmith>=0.4",
  "lxml>=6.0",
  "pillow>=11.0",
  "pydantic>=2.11",
  "pydantic-settings>=2.10",
  "psycopg[binary]>=3.2",
  "python-dateutil>=2.9",
  "rapidfuzz>=3.14",
  "rich>=14.0",
  "tenacity>=9.1",
  "trafilatura>=2.0",
  "typer>=0.20",
]

[dependency-groups]
dev = [
  "pypdf>=6.19.0",
  "pytest>=8.4",
  "pytest-asyncio>=1.2",
  "reportlab>=5.0.1",
  "respx>=0.22",
  "ruff>=0.14",
]

[project.scripts]
ani-menu = "ani_menu_agent.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ani_menu_agent"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"

[tool.ruff]
target-version = "py312"
line-length = 100
exclude = ["references/legacy"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

