# Production preparation only. Both default commands are --help; no provider key.
# Existing jobs/network/artifact bindings are reused without creating or migrating them.
name: menu-rag-prepared
x-runtime: &runtime
  profiles: [rag-prepared]
  user: "10001:10001"
  init: true
  restart: "no"
  read_only: true
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  tmpfs: ["/tmp:rw,noexec,nosuid,size=128m"]
  pids_limit: 192
  cpus: "0.5"
  mem_limit: 512m
  stop_grace_period: 30s
  healthcheck: {disable: true}
  logging:
    driver: json-file
    options: {max-size: "5m", max-file: "2"}
services:
  rag-worker:
    <<: *runtime
    image: ${RAG_WORKER_IMAGE:?Set reviewed sha256 image ID}
    command: [celery, -A, "menu_worker.rag_app:app", worker, --help]
    environment:
      CONTENT_JOB_DATABASE_URL: "postgresql://menu_jobs:${CONTENT_JOB_DB_PASSWORD:?Use existing jobs credential}@jobs-db:5432/menu_content_jobs"
      CONTENT_JOB_ARTIFACT_ROOT: /var/lib/menu-jobs
      CELERY_BROKER_URL: redis://generation-redis:6379/0
      CELERY_RESULT_BACKEND: redis://generation-redis:6379/1
      RAG_GENERATION_ENABLED: "false"
      RAG_RUNTIME_CONFIG_FILE: /run/rag/runtime.json
      OPENAI_API_KEY: ""
      LLM_KEY: ""
      LANGSMITH_TRACING: "false"
      LANGCHAIN_TRACING_V2: "false"
    networks: [tasks, rag-vector]
    volumes:
      - type: bind
        source: /home/ubuntu/me-nu-beta-20261116/artifacts
        target: /var/lib/menu-jobs
        bind: {create_host_path: false}
      - type: bind
        source: ${RAG_ISOLATED_STATE_HOST_DIR:?Set prepared execution copy directory}
        target: /var/lib/menu-rag
        bind: {create_host_path: false}
      - type: bind
        source: ${RAG_RUNTIME_CONFIG_HOST_FILE:?Set disabled reviewed runtime JSON}
        target: /run/rag/runtime.json
        read_only: true
        bind: {create_host_path: false}
      - type: bind
        source: ${RAG_IMAGE_HOST_DIR:?Set preserved image directory}
        target: /opt/rag-images
        read_only: true
        bind: {create_host_path: false}
      - type: bind
        source: ${RAG_VECTOR_DSN_HOST_FILE:?Set dedicated vector read-only DSN file}
        target: /run/secrets/rag-vector-dsn
        read_only: true
        bind: {create_host_path: false}
    cpus: "1.0"
    mem_limit: 1536m
    stop_grace_period: 3780s
  rag-pending-importer:
    <<: *runtime
    image: ${RAG_IMPORTER_IMAGE:?Set reviewed backend sha256 image ID}
    entrypoint: [python, -B, -m, app.services.rag_pending_import]
    command: [--help]
    environment:
      # Satisfies Settings imports only. Actual apply requires a separately
      # supplied --database-url-file and reviewed target; this DSN cannot connect.
      DATABASE_URL: postgresql+psycopg://offline@127.0.0.1:1/offline_not_used
      MENU_DEPLOYMENT_ENV: production
      CHECKING_CAROUSEL_TEST_PREVIEW_ENABLED: "false"
      OPENAI_API_KEY: ""
      LLM_KEY: ""
    networks: [data]
    volumes:
      - type: bind
        source: /home/ubuntu/me-nu-beta-20261116/artifacts
        target: /var/lib/menu-jobs
        read_only: true
        bind: {create_host_path: false}
      - type: bind
        source: /home/ubuntu/me-nu-beta-20261116/state/${RAG_INBOX_NAME:?Set separate RAG inbox directory name}
        target: /runtime/state/${RAG_INBOX_NAME:?Set separate RAG inbox directory name}
        read_only: true
        bind: {create_host_path: false}
networks:
  tasks:
    external: true
    name: menu-beta-generation-20261116_tasks
  data:
    external: true
    name: me-nu-checking_data
  rag-vector:
    external: true
    name: ${RAG_VECTOR_NETWORK:?Set prepared private vector network}
